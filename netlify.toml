[build]
  publish = "_site"
  command = "node scripts/check-lead-services.mjs && npm run test:security && npm run build"
  ignore = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "24"

# Administration and leads use authenticated/validated server functions.

# Canonical routes are maintained in _redirects.

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Custom headers for admin area
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Custom headers for static assets
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# Custom headers for favicon and icons
[[headers]]
  for = "/favicon.*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# Content Security Policy
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; connect-src 'self' https://challenges.cloudflare.com;"

# Netlify handles gzip compression automatically


# Server settings are documented in docs/security-release.md.
# Set credentials in the Netlify UI; prefer Functions scope where available.
# Free-plan automatic scopes are allowed; never embed credentials in this file.

# Keep deploy previews and non-production branches out of search results.
[context.deploy-preview]
  command = "node scripts/check-lead-services.mjs && npm run test:security && npm run build:preview"

[context.branch-deploy]
  command = "npm run test:security && npm run build:preview"
