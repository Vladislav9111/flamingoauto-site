<head>

    <meta name="description" content="Flamingo Auto blog — useful materials about selling cars, tips and stories.">
    <link rel="canonical" href="https://flamingoauto.eu/blog-et">
        <link rel="alternate" hreflang="et-EE" href="https://flamingoauto.eu/blog-et">
    <link rel="alternate" hreflang="ru-EE" href="https://flamingoauto.eu/blog-ru">
    <link rel="alternate" hreflang="x-default" href="https://flamingoauto.eu/blog-et">
    <meta name="robots" content="index, follow">
    <meta property="og:title" content="Flamingo Auto — Blog">
    <meta property="og:description" content="Useful materials about selling cars, tips and stories.">
    <meta property="og:image" content="https://flamingoauto.eu/static/images/flamingo-hero.png">

    <link rel="icon" type="image/png" sizes="32x32" href="/static/images/icon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/images/icon-180.png">
    
    <link rel="stylesheet" href="/style.css">

<body>
    <header class="site-header" role="banner">
        <div class="container">
            <div class="hero-header">
                <a class="logo" href="/">FLAMINGO AUTO</a>
            </div>
        </div>
    </header>

    <main class="container" style="max-width:900px; padding-top:2rem;">
        <h1>Blog</h1>
        <p class="quote-sub">Полезные материалы о продаже автомобилей, советы и истории.</p>

        <!-- dynamic posts will be injected here -->
        <div id="posts-container" style="margin-top:1rem; display:grid; gap:1rem;"></div>

        <!-- fallback for no posts -->
        <div id="no-posts" style="background:#fff;padding:1.25rem;border-radius:8px;margin-top:1rem; display:none;">
            <h2>Пока нет публикаций</h2>
            <p>Добавьте первую запись через панель администратора.</p>
           
        </div>

    </main>

    <footer class="site-footer" style="margin-top:2rem;">
        <div class="container footer-inner">
            <p>Flamingo Auto. Все права защищены. Таллин, Эстония</p>
            <a class="blog-btn" href="/blog-et" aria-label="Blog">Блог</a>
        </div>
    </footer>

    <script src="blog-github.js"></script>

  <script src="https://unpkg.com/heic2any/dist/heic2any.min.js"></script>
