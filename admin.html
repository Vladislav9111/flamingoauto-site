<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Flamingo Auto — управление</title>
<link rel="stylesheet" href="/style.css"><script src="/admin-secure.js" defer></script></head>
<body><main class="container article-content"><h1>Flamingo Auto — управление</h1>
<p id="admin-status" role="status" aria-live="polite"></p>
<form id="admin-login" method="post" action="/.netlify/functions/admin-session">
<label for="admin-password">Пароль администратора</label>
<input id="admin-password" name="password" type="password" autocomplete="current-password" required minlength="16" maxlength="256">
<button type="submit">Войти</button></form>
<button type="button" id="admin-logout">Выйти</button><h2>Статьи</h2><ul id="articles"></ul>
<button type="button" id="new-article">Новая статья</button>
<form id="article-editor" hidden>
<p>Сохранение может запустить публикацию сайта. Перед сохранением проверьте текст.</p>
<label for="article-title">Заголовок</label><input id="article-title" name="title" required maxlength="200">
<label for="article-locale">Язык</label><select id="article-locale" name="locale"><option value="et">Eesti</option><option value="ru">Русский</option></select>
<label for="article-excerpt">Краткое описание</label><textarea id="article-excerpt" name="excerpt" maxlength="500"></textarea>
<label for="article-content">Текст</label><textarea id="article-content" name="content" rows="18" required maxlength="40000"></textarea>
<button id="save-article" type="submit">Сохранить статью</button></form>
<p><a href="/">Вернуться на сайт</a></p></main></body></html>
